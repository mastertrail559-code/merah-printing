<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Pesanan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── NAVBAR ── */
  nav {
    width: 100%;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 64px;
    box-sizing: border-box;
    font-family: 'Syne', sans-serif;
    padding: 0;
  }

  .navbar-container {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 2rem;
    box-sizing: border-box;
  }

  /* ── LEFT SIDE (LOGO) ── */
  .navbar-left {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .navbar-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
  }

  .navbar-logo img {
    height: 40px;
    width: auto;
    display: block;
    object-fit: contain;
  }

  /* ── DIVIDER ── */
  .navbar-sep {
    width: 1px;
    height: 24px;
    background: #e5e5e5;
    flex-shrink: 0;
  }

  /* ── CENTER (NAV LINKS) ── */
  .navbar-center {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .navbar-center a {
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    color: #666;
    transition: color .2s;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: border-color .2s, color .2s;
  }

  .navbar-center a:hover {
    color: #d63c2f;
    border-bottom-color: #d63c2f;
  }

  .navbar-center a.active {
    color: #d63c2f;
    border-bottom-color: #d63c2f;
  }

  /* ── RIGHT SIDE (ACCOUNT) ── */
  .navbar-right {
    display: flex;
    align-items: center;
    gap: .8rem;
  }

  .navbar-account {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f5f5f5;
    border: 1.5px solid #e5e5e5;
    cursor: pointer;
    text-decoration: none;
    color: #666;
    flex-shrink: 0;
    transition: all .18s;
  }

  .navbar-account:hover {
    background: #f0f0f0;
    border-color: #d63c2f;
    color: #d63c2f;
  }

  .navbar-account svg {
    width: 20px;
    height: 20px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .navbar-container {
      padding: 0 1rem;
    }
    }

    .navbar-center {
      gap: 1rem;
    }

    .navbar-center a {
      font-size: 14px;
    }

    .navbar-logo img {
      height: 36px;
    }
  }

  @media (max-width: 600px) {
    nav {
      height: 56px;
    }

    .navbar-logo img {
      height: 32px;
    }

    .navbar-center {
      gap: 0.8rem;
    }

    .navbar-center a {
      font-size: 13px;
    }

    .navbar-sep {
      display: none;
    }

    .navbar-account {
      width: 36px;
      height: 36px;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="navbar-container">
    <!-- LEFT -->
    <div class="navbar-left">
      <a href="{{ url_for('main.index') }}" class="navbar-logo" title="Merah Printing">
        <img src="{{ url_for('static', filename='images/api.png') }}" alt="Merah Printing Logo">
      </a>
      <div class="navbar-sep"></div>
    </div>

    <!-- CENTER -->
    <div class="navbar-center">
      <a href="{{ url_for('main.pesanan') }}" class="{% if 'pesanan' in request.path %}active{% endif %}">Pesanan</a>
      <a href="{{ url_for('main.profile') }}" class="{% if 'profile' in request.path %}active{% endif %}">Profile</a>
    </div>

    <!-- RIGHT -->
    <div class="navbar-right">
      {% if request.path != url_for('main.profile') %}
      <a href="{{ url_for('main.profile') }}" class="navbar-account" title="Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      {% endif %}
    </div>
  </div>
</nav>

</body>
</html>
