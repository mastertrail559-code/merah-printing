{% extends "layout/user_base.html" %}

{% block content %}

<div class="checkout-wrapper">

    <div class="checkout-card">

        <!-- KIRI: GAMBAR PRODUK -->
        <div class="checkout-left">
            <img src="{{ url_for('static', filename='images/tumbler.png') }}" alt="Preview Tumbler">
        </div>

        <!-- KANAN: FORM -->
        <div class="checkout-right">

            <h2>Checkout Tumbler</h2>

            <form action="{{ url_for('main.checkout_tumbler') }}" method="POST">

                <div class="section">
                    <h3>Informasi Customer</h3>

                    <input type="text" name="name" placeholder="Nama Lengkap" required>
                    <input type="text" name="phone" placeholder="No WhatsApp" required>
                    <input type="text" name="alamat" placeholder="Alamat Lengkap" required>
                    <textarea name="note" placeholder="Catatan tambahan (opsional)"></textarea>
                </div>

                <div class="section">
                    <h3>Detail Produk</h3>

                    <div class="row">
                        <select id="tumbler_color" name="tumbler_color">
                            <option value="Putih">Putih</option>
                            <option value="Hitam">Hitam</option>
                            <option value="Merah">Merah</option>
                            <option value="Biru">Biru</option>
                            <option value="Hijau">Hijau</option>
                            <option value="Ungu">Ungu</option>
                        </select>

                        <select id="tumbler_type" name="tumbler_type">
                            <option value="Stainless">Stainless Steel</option>
                            <option value="Plastic">Plastic</option>
                            <option value="Ceramic">Ceramic</option>
                        </select>

                        <select id="tumbler_size" name="tumbler_size">
                            <option value="350ml">350ml</option>
                            <option value="500ml">500ml</option>
                            <option value="750ml">750ml</option>
                        </select>

                    </div>
                    <input type="hidden" name="product" value="Tumbler">
                    <input type="number" id="quantity" name="quantity" min="1" value="1">
                    <input type="hidden" name="total_price" id="totalInput" action="" method="">
                </div>

                <div class="section total-box">
                    <h3>Total Harga</h3>
                    <div class="total-price">
                        Rp <span id="totalHarga">0</span>
                    </div>
                </div>

                <div class="section">
                    <select name="payment_method">
                        <option value="Transfer">Transfer</option>
                        <option value="COD">COD</option>
                    </select>
                </div>

                <button type="submit" class="btn-checkout">Checkout Sekarang</button>

            </form>

        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/jav.js') }}"></script>

{% endblock %}
