<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="login-container">

    <img src="{{ url_for('static', filename='images/api.png') }}" 
         alt="Logo" 
         class="logo">

    <h1>Login</h1>


    <!-- ALERT FLASH FLASK -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}
    {% endwith %}


    <form action="{{ url_for('auth.login') }}" method="post">

        <input 
        type="email" 
        placeholder="Email" 
        name="email" 
        required>

        <input 
        type="password" 
        placeholder="Password" 
        name="password" 
        required>

        <button type="submit">
            Login
        </button>

        <p>
            Belum punya akun?
            <a href="{{ url_for('auth.register') }}">
                Daftar di sini
            </a>
        </p>

    </form>

</div>

</body>
</html>
